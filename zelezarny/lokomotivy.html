<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Lokomotivy modulového kolejiště Železárny.">
  <meta name="theme-color" content="#090b0d">
  <title>Lokomotivy | Železárny</title>
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">
  <script type="module" src="assets/js/main.js"></script>
  <script type="module" src="assets/js/lokomotivy.js"></script>
</head>
<body data-page="locomotives">
  <header class="site-header" id="siteHeader"></header>

  <main>
    <section class="page-hero locomotive-hero">
      <div class="container page-hero-grid">
        <div><p class="eyebrow reveal">VOZOVÝ PARK</p><h1 class="page-title reveal">Lokomotivy</h1></div>
        <p class="page-intro reveal">Stroje určené pro posun, přetahy a obsluhu jednotlivých částí železárenského areálu.</p>
      </div>
    </section>

    <section class="catalog-controls container">
      <div class="filter-row" role="group" aria-label="Filtr lokomotiv">
        <button class="filter-button active" data-filter="all">Všechny</button>
        <button class="filter-button" data-filter="dieselova">Motorové</button>
        <button class="filter-button" data-filter="elektricka">Elektrické</button>
      </div>
      <p class="catalog-count"><span id="locoCount">0</span> lokomotiv</p>
    </section>

    <section class="locomotive-list container-wide" id="locomotiveList"></section>

    <section class="next-page-panel">
      <div class="container next-page-grid">
        <div><p class="eyebrow">DALŠÍ KAPITOLA</p><h2 class="section-title">Vozy.</h2></div>
        <a class="circle-link" href="vozy.html" aria-label="Přejít na vozy">↗</a>
      </div>
    </section>
  </main>

  <dialog class="loco-dialog" id="locoDialog">
    <button class="dialog-close" id="dialogClose" aria-label="Zavřít detail">×</button>
    <div id="dialogContent"></div>
  </dialog>

  <footer class="site-footer" id="siteFooter"></footer>
</body>
</html>
